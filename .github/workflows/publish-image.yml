# Buduje obraz kontenera i publikuje go w GitHub Container Registry.
#
# Dzięki temu maszyny docelowe (np. NAS z OpenMediaVault) tylko pobierają
# gotowy obraz — nie potrzebują gita, narzędzi budowania ani pamięci na
# kompilację frontendu.

name: Publikacja obrazu

on:
  push:
    branches: [main]
    # Zmiany wyłącznie w dokumentacji nie wymagają nowego obrazu.
    paths-ignore:
      - 'README.md'
      - 'README.pl.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Nazwa obrazu małymi literami
        # GHCR wymaga małych liter, a nazwa repozytorium zawiera wielkie.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: QEMU (budowanie pod arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi i etykiety obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Budowanie i publikacja
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Podsumowanie
        run: |
          {
            echo "### Obraz opublikowany"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Platformy: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
